openapi: 3.0.1
info:
  title: SAP Customer Provider API
  description: Returns customer data by customer ID.
  version: 1.0.0
servers:
  - url: http://localhost:5280
    description: Local development (dotnet run)
security: []
tags:
  - name: Customers
    description: Customer data
paths:
  /customers/{id}:
    get:
      tags:
        - Customers
      summary: Get a customer by ID
      operationId: getCustomerById
      parameters:
        - name: id
          in: path
          description: The customer ID. Must be an integer.
          required: true
          schema:
            type: integer
            format: int32
          example: 12345
      responses:
        '200':
          description: The customer was found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
              example:
                id: 12345
                name: Susan Jones
                status: ACTIVE
                address:
                  street: Main Street
                  houseNumber: 15
                  city: New York
                  zipCode: Y1A 2B3
                email: susan.jones@example.com
                phone: '+1-555-555-0123'
                lastModified: '2026-10-15T10:30:12Z'
        '400':
          description: The customer ID is not an integer.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://tools.ietf.org/html/rfc9110#section-15.5.1
                title: Invalid customer ID
                status: 400
                detail: Customer ID 'abc' is not an integer.
        '404':
          description: No customer exists with the given ID.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://tools.ietf.org/html/rfc9110#section-15.5.5
                title: Customer not found
                status: 404
                detail: Customer with ID 99999 was not found.
components:
  schemas:
    Customer:
      type: object
      required:
        - id
        - name
        - status
        - address
        - email
        - phone
        - lastModified
      properties:
        id:
          type: integer
          format: int32
          example: 12345
        name:
          type: string
          example: Susan Jones
        status:
          type: string
          example: ACTIVE
        address:
          $ref: '#/components/schemas/Address'
        email:
          type: string
          example: susan.jones@example.com
        phone:
          type: string
          example: '+1-555-555-0123'
        lastModified:
          type: string
          format: date-time
          example: '2026-10-15T10:30:12Z'
    Address:
      type: object
      required:
        - street
        - houseNumber
        - city
        - zipCode
      properties:
        street:
          type: string
          example: Main Street
        houseNumber:
          type: integer
          format: int32
          example: 15
        city:
          type: string
          example: New York
        zipCode:
          type: string
          example: Y1A 2B3
    ProblemDetails:
      description: RFC 9457 problem details.
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
